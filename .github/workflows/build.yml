name: N Launcher build and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar a versão atual da main após todos os testes'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.9'
      - name: Test synthetic readers, cache, profiles, updater and migration
        run: |
          mkdir -p build
          gcc -O2 -DZSTD_DISABLE_ASM -c third_party/zstd/zstddeclib.c -o build/zstd.o
          python3 tools/prepare_zbic.py
          gcc -O2 -DNX2_LOADER -c build/generated/zbic.c -o build/zbic.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -Ithird_party/zstd src/input.cpp src/program.cpp src/cli.cpp build/zstd.o build/zbic.o -o build/probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ithird_party/zstd tests/test_zbic.cpp build/zbic.o build/zstd.o -o build/zbic-test
          build/zbic-test
          python3 tests/test_program.py build/probe
          python3 tests/test_input.py build/probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/test_module_lease.cpp -o build/lease-test
          build/lease-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -Ithird_party/zstd src/input.cpp src/cache.cpp tests/cache_probe.cpp build/zstd.o -o build/cache-probe
          python3 tests/test_cache.py build/cache-probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/test_frame_acquire.cpp -o build/frame-acquire-test
          build/frame-acquire-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itests/mock -Iinclude src/input.cpp src/native_input.cpp tests/native_backend_probe.cpp -o build/native-backend
          python3 tests/test_native_backend.py build/native-backend
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude src/input.cpp src/update.cpp src/http.cpp src/profile.cpp src/layout.cpp tests/test_app_core.cpp -o build/app-core-test
          build/app-core-test "$(mktemp -d)"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itests/tls_mock -Iinclude tests/test_tls_socket.cpp -o build/tls-socket-test
          build/tls-socket-test
          python3 -m pip install -r requirements-build.txt
          python3 tools/build_gui.py --preview --compiler g++
  switch2:
    needs: host
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.9'
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        id: msys2
        with:
          msystem: MSYS
          update: false
      - name: Download and verify pinned public SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $pin=Get-Content config/windows-sdk.json -Raw | ConvertFrom-Json
          $scratch=Join-Path $env:RUNNER_TEMP 'sdk'
          gh release download $pin.githubRelease --pattern $pin.file --dir $scratch
          if($LASTEXITCODE -ne 0){throw 'SDK download failed'}
          $archive=Join-Path $scratch $pin.file
          if((Get-Item $archive).Length -ne $pin.bytes -or (Get-FileHash $archive -Algorithm SHA256).Hash -ne $pin.sha256){throw 'SDK integrity mismatch'}
          tar -xzf $archive -C $scratch
          if($LASTEXITCODE -ne 0){throw 'SDK extraction failed'}
          "NX2_SDK=$scratch/devkitpro" >> $env:GITHUB_ENV
      - name: Install pinned build-only image/font dependency
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Build and verify both Switch 2 NROs
        shell: pwsh
        run: ./scripts/build-switch2.ps1 -SdkRoot $env:NX2_SDK -SupportRoot '${{ steps.msys2.outputs.msys2-location }}/usr/bin'
      - name: Package verified app, updater manifest and licenses
        shell: pwsh
        run: python tools/package_release.py
      - name: Save test draft or publish requested stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $meta=Get-Content dist/release.json -Raw | ConvertFrom-Json
          $publish=($env:GITHUB_REF_TYPE -eq 'tag') -or ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:PUBLISH_RELEASE -eq 'true')
          $tag="test-$env:GITHUB_RUN_ID"
          if($publish){
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if($LASTEXITCODE -ne 0){throw 'Only reviewed main commits may be published'}
            if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $meta.tag){throw 'Tag and application version differ'}
            if($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main'){throw 'Dispatch a public release only from main'}
            $tag=$meta.tag
          }
          $notes="N Launcher $($meta.version). NUP completo/splitado; perfis de memória; atualizador no console. Cache e saves preservados."
          $notesPath=Join-Path $env:RUNNER_TEMP 'n-launcher-release-notes.txt'
          $sourceNotes="docs/releases/$($meta.version).md"
          if(Test-Path $sourceNotes){Copy-Item -LiteralPath $sourceNotes -Destination $notesPath}else{Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8}
          gh release create $tag dist/n-launcher.nro dist/update.ini dist/SHA256SUMS.txt "dist/$($meta.zip)" --draft --target $env:GITHUB_SHA --title "N Launcher $($meta.version)" --notes-file $notesPath
          if($LASTEXITCODE -ne 0){throw 'Release staging failed; nothing published'}
          if($publish){
            gh release edit $tag --draft=false --latest
            if($LASTEXITCODE -ne 0){throw 'Release remains a draft; publication failed'}
          }
