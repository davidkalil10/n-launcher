name: N Launcher build and verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test shared reader with synthetic inputs only
        run: |
          mkdir -p build
          gcc -O2 -DZSTD_DISABLE_ASM -c third_party/zstd/zstddeclib.c -o build/zstd.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -Ithird_party/zstd src/input.cpp src/program.cpp src/cli.cpp build/zstd.o -o build/probe
          python3 tests/test_program.py build/probe
          python3 tests/test_input.py build/probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/test_module_lease.cpp -o build/lease-test
          build/lease-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -Ithird_party/zstd src/input.cpp src/cache.cpp tests/cache_probe.cpp build/zstd.o -o build/cache-probe
          python3 tests/test_cache.py build/cache-probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itests/mock -Iinclude src/input.cpp src/native_input.cpp tests/native_backend_probe.cpp -o build/native-backend
          python3 tests/test_native_backend.py build/native-backend
          python3 -m pip install -r requirements-build.txt
          python3 tools/build_gui.py --preview --compiler g++
  switch2:
    needs: host
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.9'
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        id: msys2
        with:
          msystem: MSYS
          update: false
      - name: Download and verify pinned public SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $pin=Get-Content config/windows-sdk.json -Raw | ConvertFrom-Json
          $scratch=Join-Path $env:RUNNER_TEMP 'sdk'
          gh release download $pin.githubRelease --pattern $pin.file --dir $scratch
          if($LASTEXITCODE -ne 0){throw 'SDK download failed'}
          $archive=Join-Path $scratch $pin.file
          if((Get-Item $archive).Length -ne $pin.bytes -or (Get-FileHash $archive -Algorithm SHA256).Hash -ne $pin.sha256){throw 'SDK integrity mismatch'}
          tar -xzf $archive -C $scratch
          if($LASTEXITCODE -ne 0){throw 'SDK extraction failed'}
          "NX2_SDK=$scratch/devkitpro" >> $env:GITHUB_ENV
      - name: Install pinned build-only image/font dependency
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Build and verify Switch 2 startup and libraries
        shell: pwsh
        run: ./scripts/build-switch2.ps1 -SdkRoot $env:NX2_SDK -SupportRoot '${{ steps.msys2.outputs.msys2-location }}/usr/bin'
      - name: Save test build as a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "probe-$env:GITHUB_RUN_ID" dist/nx2-link-switch2.nro dist/SHA256SUMS.txt --draft --prerelease --target $env:GITHUB_SHA --title "N Launcher 0.0.4 - test $env:GITHUB_RUN_ID" --notes 'Experimental N Launcher: graphical library, NUP/split reader, verified streaming SD cache and embedded generic loader. Uses existing kaiHEN. Game/audio/save validation on hardware is pending.'
          if($LASTEXITCODE -ne 0){throw 'Draft upload failed'}
